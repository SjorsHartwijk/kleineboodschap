<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/instellingen.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#154666"/>
    <title>Wrapped: het jaar in cijfers | Kleine Boodschap Data</title>
    <meta name="description" content="Het jaar van Kleine Boodschap in cijfers: afleveringen, luistertijd, de langste aflevering en de favoriete categorie. Te zien van 1 januari tot 1 maart.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kbdata.nl/wrapped.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:site_name" content="Kleine Boodschap Data">
    <meta property="og:title" content="Wrapped: het jaar in cijfers | Kleine Boodschap Data">
    <meta property="og:description" content="Het jaar van Kleine Boodschap in cijfers: afleveringen, luistertijd, de langste aflevering en de favoriete categorie. Te zien van 1 januari tot 1 maart.">
    <meta property="og:url" content="https://kbdata.nl/wrapped.html">
    <meta property="og:image" content="https://kbdata.nl/assets/images/opengraph.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div data-layout="nav"></div>
    <script src="assets/js/layout.js"></script>
    <main class="wrapped pb-3">
        <div class="container" id="wrappedContainer">
        <div class="row">
            <div class="col-12 pt-4 pt-lg-5">
                <h1 class="kb-paginakop">Kleine Boodschap Wrapped <span id="selectedYear"></span></h1>
                <p class="lead">Ontdek unieke statistieken en jaaroverzichten van de Kleine Boodschap podcast in Wrapped.</p>
                <!-- Alert: Wrapped blijft beschikbaar tot 1 maart -->
                <div id="wrappedAlert" class="alert alert-info d-none" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    Wrapped blijft beschikbaar tot 1 maart
                </div>
                <script>
                    (function() {
                        const now = new Date();
                        const jaar = now.getFullYear();
                        const start = new Date(jaar, 1, 10); // 10 februari (maand 1 = februari)
                        const end = new Date(jaar, 2, 1);    // 1 maart (maand 2 = maart)
                        if (now >= start && now < end) {
                            document.getElementById("wrappedAlert").classList.remove("d-none");
                        }
                    })();
                </script>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-12 col-md-9">
                                <label for="categoryFilter" class="form-label">Filter op categorie:</label>
                                <select id="categoryFilter" class="form-select">
                                    <option value="all">Alle categorieën</option>
                                    <option value="nieuws">Nieuws</option>
                                    <option value="achtergrond">Achtergrond</option>
                                    <option value="reportage">Reportage</option>
                                    <option value="interview">Interview</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3">
                                <label for="yearSelect" class="form-label">Kies een ander jaar:</label>
                                <select id="yearSelect" class="form-select"></select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mt-4">
                <h2 class="h3">Statistieken</h2>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-5 g-3 mb-4" id="stats"></div>
        <div class="mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h3">Afleveringen</h2>
                    <div class="d-flex flex-wrap gap-3 small mb-2" aria-label="Legenda">
                        <span><span class="badge achtergrond kb-wrapped-blokje">&nbsp;</span> Achtergrond</span>
                        <span><span class="badge nieuws kb-wrapped-blokje">&nbsp;</span> Nieuws</span>
                        <span><span class="badge interview kb-wrapped-blokje">&nbsp;</span> Interview</span>
                        <span><span class="badge reportage kb-wrapped-blokje">&nbsp;</span> Reportage</span>
                    </div>
                    <canvas id="barChart" role="img" aria-label="Staafdiagram met de duur van elke aflevering van dit jaar, per categorie gekleurd"></canvas>
                </div>
            </div>
        </div>
        <div class="mb-4">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-baseline gap-2">
                        <h2 class="h3">Mijn favorieten van <span data-favorieten-jaar></span></h2>
                        <span class="small kb-muted" id="favorietenAantal"></span>
                    </div>
                    <div class="row g-4">
                        <div class="col-12 col-lg-7">
                            <div id="favorietenMelding" class="alert alert-warning py-2 d-none" role="status"></div>
                            <div id="favorietenLijst"></div>
                            <div class="mt-3">
                                <button type="button" class="btn btn-primary" data-favorieten-actie="deel" disabled>
                                    <i class="bi bi-share me-1" aria-hidden="true"></i> Deel als afbeelding</button>
                            </div>
                        </div>
                        <div class="col-12 col-lg-5 kb-favorieten-voorbeeld d-none">
                            <img id="favorietenVoorbeeld" class="img-fluid" alt="Voorbeeld van de afbeelding met je favoriete afleveringen" title="Zo ziet je gedeelde afbeelding eruit">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h3">Afleveringen van <span id="episodeYear"></span></h2>
                    <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th><span class="visually-hidden">Favoriet</span></th>
                                <th aria-sort="none"><button type="button" class="kb-sorteerknop" onclick="sortTable(1)">ID <i class="bi bi-sort-down" aria-hidden="true"></i></button></th>
                                <th>Titel</th>
                                <th>Categorie</th>
                                <th aria-sort="none"><button type="button" class="kb-sorteerknop" onclick="sortTable(4)">Tijdsduur <i class="bi bi-sort-down" aria-hidden="true"></i></button></th>
                                <th aria-sort="none"><button type="button" class="kb-sorteerknop" onclick="sortTable(5)">Datum <i class="bi bi-sort-down" aria-hidden="true"></i></button></th>
                            </tr>
                        </thead>
                        <tbody id="episodeTable"></tbody>
                    </table>
                    </div>
                </div>
            </div>
        </div>
        </div>     
    </main>
    <!-- Footer-->
    <div data-layout="footer"></div>
    <script src="assets/js/wrapped_favorieten.js"></script>
    <script src="wrapped.js"></script>
    <script>
        const container = document.getElementById("wrappedContainer");

        const vandaag = new Date();
        const jaar = vandaag.getFullYear();

        // Wrapped is zichtbaar van 1 januari t/m 1 maart (exclusief 1 maart)
        const beginJan = new Date(jaar, 0, 1);   // 1 januari
        const eindMrt  = new Date(jaar, 2, 1);   // 1 maart

        // Lokaal (localhost) altijd zichtbaar, om buiten de periode te kunnen testen
        const lokaal = ['localhost', '127.0.0.1'].includes(location.hostname);
        const zichtbaar = lokaal || (vandaag >= beginJan && vandaag < eindMrt);

        if (!zichtbaar) {
          container.innerHTML = "<h1 class=\"display-1 pt-5\">Kleine Boodschap Wrapped</h1><p class=\"fw-bold text-white\">Deze pagina is alleen zichtbaar van 1 januari tot 1 maart.</p>";
        }
</script>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
<!-- Cookiemelding en Google Analytics (alleen na toestemming) -->
<script src="assets/js/cookies.js"></script>
</body>
</html>
