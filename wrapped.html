<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/instellingen.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo2.svg">
    <link rel="icon" type="image/png" href="assets/images/logo2.png">
    <title>Kleine Boodschap Wrapped - Kleine Boodschap Data</title>
    <meta name="theme-color" content="#154666"/>
    <meta property="og:title" content="Kleine Boodschap Data">
    <meta property="og:site_name" content="Kleine Boodschap Data">
    <meta property="og:url" content="https://kbdata.nl/wrapped.html">
    <meta property="og:description" content="Ontdek unieke statistieken en jaaroverzichten van de Kleine Boodschap podcast in Wrapped. Ontdek verrassende inzichten. Beschikbaar van november tot en met januari.">
    <meta property="og:type" content="">
    <meta property="og:image" content="assets/images/opengraph.png">
    <meta name="description"
        content="Ontdek unieke statistieken en jaaroverzichten van de Kleine Boodschap podcast in Wrapped. Ontdek verrassende inzichten. Beschikbaar van november tot en met januari.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div data-layout="nav"></div>
    <script src="assets/js/layout.js"></script>
    <main class="wrapped pb-3">
        <div class="container" id="wrappedContainer">
        <div class="row">
            <div class="col-12 pt-4 pt-lg-5">
                <h1 class="display-2">Kleine Boodschap Wrapped <span id="selectedYear"></span></h1>
                <p class="lead">Ontdek unieke statistieken en jaaroverzichten van de Kleine Boodschap podcast in Wrapped.</p>
                <!-- Alert: Wrapped blijft beschikbaar tot 1 maart -->
                <div id="wrappedAlert" class="alert alert-info d-none" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    Wrapped blijft beschikbaar tot 1 maart
                </div>
                <script>
                    (function() {
                        const now = new Date();
                        const jaar = now.getFullYear();
                        const start = new Date(jaar, 1, 10); // 10 februari (maand 1 = februari)
                        const end = new Date(jaar, 2, 1);    // 1 maart (maand 2 = maart)
                        if (now >= start && now < end) {
                            document.getElementById("wrappedAlert").classList.remove("d-none");
                        }
                    })();
                </script>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-12 col-md-9">
                                <label for="categoryFilter" class="form-label">Filter op categorie:</label>
                                <select id="categoryFilter" class="form-select">
                                    <option value="all">Alle categorieën</option>
                                    <option value="nieuws">Nieuws</option>
                                    <option value="achtergrond">Achtergrond</option>
                                    <option value="reportage">Reportage</option>
                                    <option value="interview">Interview</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3">
                                <label for="yearSelect" class="form-label">Kies een ander jaar:</label>
                                <select id="yearSelect" class="form-select"></select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mt-4">
                <h3>Statistieken</h3>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-5 g-3 mb-4" id="stats"></div>
        <div class="row mb-4">
            <div class="card col-12">
                <div class="card-body">
                    <h3>Afleveringen</h3>
                    <div class="d-flex flex-wrap gap-3 small mb-2" aria-label="Legenda">
                        <span><span class="badge achtergrond kb-wrapped-blokje">&nbsp;</span> Achtergrond</span>
                        <span><span class="badge nieuws kb-wrapped-blokje">&nbsp;</span> Nieuws</span>
                        <span><span class="badge interview kb-wrapped-blokje">&nbsp;</span> Interview</span>
                        <span><span class="badge reportage kb-wrapped-blokje">&nbsp;</span> Reportage</span>
                    </div>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="card col-12">
                <div class="card-body">
                    <h3>Afleveringen van <span id="episodeYear"></span></h3>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th onclick="sortTable(0)">ID <i class="bi bi-sort-down"></i></th>
                                <th>Titel</th>
                                <th>Categorie</th>
                                <th onclick="sortTable(3)">Tijdsduur <i class="bi bi-sort-down"></i></th>
                                <th onclick="sortTable(4)">Datum <i class="bi bi-sort-down"></i></th>
                            </tr>
                        </thead>
                        <tbody id="episodeTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
        </div>     
    </main>
    <div data-layout="mobile-nav"></div>
    <!-- Footer-->
    <div data-layout="footer"></div>
    <script src="wrapped.js"></script>
    <script>
        const container = document.getElementById("wrappedContainer");

        const vandaag = new Date();
        const jaar = vandaag.getFullYear();

        // Wrapped is zichtbaar van 1 januari t/m 1 maart (exclusief 1 maart)
        const beginJan = new Date(jaar, 0, 1);   // 1 januari
        const eindMrt  = new Date(jaar, 2, 1);   // 1 maart

        const zichtbaar = vandaag >= beginJan && vandaag < eindMrt;

        if (!zichtbaar) {
          container.innerHTML = "<h1 class=\"display-1 pt-5\">Kleine Boodschap Wrapped</h1><p class=\"fw-bold text-white\">Deze pagina is alleen zichtbaar van 1 januari tot 1 maart.</p>";
        }
</script>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
<!-- Cookiemelding en Google Analytics (alleen na toestemming) -->
<script src="assets/js/cookies.js"></script>
</body>
</html>
