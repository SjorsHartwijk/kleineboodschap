<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/instellingen.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#154666"/>
    <title>Wat zal ik luisteren? | Kleine Boodschap Data</title>
    <meta name="description" content="Hoeveel tijd heb je? Kies je tijd en soort aflevering en krijg drie afleveringen van Kleine Boodschap die er precies in passen.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kbdata.nl/luisteren.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:site_name" content="Kleine Boodschap Data">
    <meta property="og:title" content="Wat zal ik luisteren? | Kleine Boodschap Data">
    <meta property="og:description" content="Hoeveel tijd heb je? Kies je tijd en soort aflevering en krijg drie afleveringen van Kleine Boodschap die er precies in passen.">
    <meta property="og:url" content="https://kbdata.nl/luisteren.html">
    <meta property="og:image" content="https://kbdata.nl/assets/images/opengraph.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column h-100">
    <!-- Navigation-->
    <div data-layout="nav"></div>
    <script src="assets/js/layout.js"></script>
    <main class="flex-shrink-0" id="luisteren">
        <section class="py-5">
            <div class="container">
                <div class="row mb-3">
                    <div class="col-12 col-xxl-9">
                        <h1 class="kb-paginakop">Wat zal ik luisteren?</h1>
                        <p>Vertel hoeveel tijd je hebt en waar je zin in hebt. Je krijgt drie afleveringen van Kleine Boodschap die in die tijd passen. Niet wat je zoekt? Met <em>Andere voorstellen</em> krijg je nieuwe tips.</p>
                        <p class="small kb-muted" data-kb-snelheid-notitie hidden></p>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body kb-kiezer">
                        <fieldset class="kb-kiezer-groep">
                            <legend class="h5">Hoeveel tijd heb je?</legend>
                            <div class="kb-tijdknoppen" id="kiezerTijden"></div>
                            <div class="kb-tijdschuif">
                                <label for="kiezerMinuten" class="visually-hidden">Eigen aantal minuten</label>
                                <input type="range" class="form-range" id="kiezerMinuten" min="5" max="120" step="5" value="45">
                                <output for="kiezerMinuten" id="kiezerMinutenWaarde" class="fw-semibold"></output>
                            </div>
                        </fieldset>

                        <fieldset class="kb-kiezer-groep">
                            <legend class="h5">Welke soort?</legend>
                            <div class="kb-filterlegenda" id="kiezerSoorten"></div>
                        </fieldset>

                        <fieldset class="kb-kiezer-groep">
                            <legend class="h5">Extra</legend>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="kiezerPlek">
                                <label class="form-check-label" for="kiezerPlek">Alleen afleveringen over een plek in de Efteling</label>
                            </div>
                            <div class="kb-periodeknoppen" role="group" aria-label="Periode" id="kiezerPeriode"></div>
                        </fieldset>
                    </div>
                </div>

                <div class="d-flex flex-wrap align-items-baseline justify-content-between gap-2 mb-3">
                    <h2 class="h4 mb-0">Voor jou</h2>
                    <button type="button" class="btn btn-primary" id="kiezerOpnieuw"><i class="bi bi-shuffle" aria-hidden="true"></i> Andere voorstellen</button>
                </div>
                <div aria-live="polite">
                    <p class="kb-muted" id="kiezerTeller"></p>
                    <div class="row g-4" id="kiezerVoorstellen"></div>
                </div>
            </div>
        </section>
    </main>
    <div data-layout="footer"></div>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cookiemelding en Google Analytics (alleen na toestemming) -->
    <script src="assets/js/cookies.js"></script>
    <script src="assets/js/luisteren.js"></script>
</body>

</html>
