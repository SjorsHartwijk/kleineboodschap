name: Send Bluesky Post

on:
  push:
    paths:
      - 'episodes.json'

jobs:
  post:
    # Geen bericht als "[geen bericht]" in het commitbericht staat (node update.js --zonder-bericht)
    if: ${{ !contains(github.event.head_commit.message, '[geen bericht]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Send Bluesky Post
        uses: myConsciousness/bluesky-post@v5
        with:
            # Eén aflevering ("Aflevering 535: Titel") → "is toegevoegd"; meerdere tegelijk
            # ("Afleveringen 535 t/m 538", zo noemt update.js die commit) → "zijn toegevoegd", in één bericht
            text: "${{ github.event.head_commit.message }} van @kleineboodschap.com ${{ startsWith(github.event.head_commit.message, 'Afleveringen ') && 'zijn' || 'is' }} toegevoegd aan Kleine Boodschap Data.\nBekijk alle statistieken op www.kbdata.nl \n\n#kleineboodschap"
            identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
            password: ${{ secrets.BLUESKY_PASSWORD }}
            retry-count: 5
