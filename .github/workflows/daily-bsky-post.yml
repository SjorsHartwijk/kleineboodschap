name: Bluesky Daily Episode Poster

on:
  schedule:
    # Cron rekent in UTC; beide tijden staan erin zodat het altijd 08:00 NL-tijd is
    - cron: '0 6 * * *' # 08:00 CEST (zomertijd)
    - cron: '0 7 * * *' # 08:00 CET (wintertijd)
  workflow_dispatch:

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check of deze cron bij de huidige NL-tijdzone hoort
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then
            echo "Handmatig gestart, altijd posten"
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          offset=$(TZ=Europe/Amsterdam date +%z)  # +0200 zomer, +0100 winter
          expected_hour=$((8 - 10#${offset:1:2}))
          cron_hour=$(echo "$SCHEDULE" | awk '{print $2}')
          echo "Cron '${SCHEDULE}', NL-offset ${offset}, verwacht UTC-uur ${expected_hour}"
          if [ "$cron_hour" -eq "$expected_hour" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Andere tijdzone dan deze cron, overslaan"
            echo "run=false" >> $GITHUB_OUTPUT
          fi

  post-to-bluesky:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.BLUESKY_IDENTIFIER }}" ] || [ -z "${{ secrets.BLUESKY_PASSWORD }}" ]; then
            echo "Missing required secrets: BLUESKY_IDENTIFIER or BLUESKY_PASSWORD"
            exit 1
          fi

      - name: Generate post text
        id: buildpost
        run: |
          today=$(date +"%m-%d")
          this_year=$(date +"%Y")

          echo "Zoek afleveringen van ${today}, exclusief jaar ${this_year}"

          POST_TEXT=""
          SHOULD_POST=false

          while IFS= read -r row; do
            id=$(echo "$row" | jq -r '.id')
            title=$(echo "$row" | jq -r '.titel')
            date=$(echo "$row" | jq -r '.datum')
            category=$(echo "$row" | jq -r '.categorie')

            ep_day_month=$(echo "$date" | cut -c6-10)
            ep_year=$(echo "$date" | cut -c1-4)
            date_formatted=$(echo "$date" | awk -F- '{print $3"-"$2"-"$1}')  # dd-mm-yyyy

            if [[ "$ep_day_month" == "$today" && "$ep_year" != "$this_year" ]]; then
              SHOULD_POST=true
              POST_TEXT="${POST_TEXT}${id}: ${title} - ${category} - ${ep_year}\n"
            fi
          done < <(jq -c '.[]' episodes.json)

          if [[ "$SHOULD_POST" == true ]]; then
            month=$(date +"%m")
            day=$(date +"%d")
            month_name=$(date +"%b" | tr '[:upper:]' '[:lower:]')
            today_formatted="${day} ${month_name}"
            # Format "9 september" instead of "09 sep"
            day=$(date +"%d" | sed 's/^0*//')
            month_number=$(date +"%m")
            # Get Dutch month name
            case $month_number in
              "01") month_name="januari" ;;
              "02") month_name="februari" ;;
              "03") month_name="maart" ;;
              "04") month_name="april" ;;
              "05") month_name="mei" ;;
              "06") month_name="juni" ;;
              "07") month_name="juli" ;;
              "08") month_name="augustus" ;;
              "09") month_name="september" ;;
              "10") month_name="oktober" ;;
              "11") month_name="november" ;;
              "12") month_name="december" ;;
            esac
            today_formatted="${day} ${month_name}"
            echo -e "#kleineboodschap archief ${today_formatted}:\n\n${POST_TEXT}" > post.txt
            echo "should_post=true" >> $GITHUB_OUTPUT
          else
            echo "Geen afleveringen vandaag."
            echo "should_post=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare post content
        if: steps.buildpost.outputs.should_post == 'true'
        run: |
          TEXT=$(cat post.txt)
          echo "TEXT<<EOF" >> $GITHUB_ENV
          echo "$TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send to Bluesky
        if: steps.buildpost.outputs.should_post == 'true'
        uses: myConsciousness/bluesky-post@v5
        with:
          text: ${{ env.TEXT }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}
          retry-count: 5